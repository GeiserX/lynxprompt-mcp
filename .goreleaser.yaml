version: 2

project_name: lynxprompt-mcp
release:
  github:
    owner: GeiserX
    name: lynxprompt-mcp
  draft: false
  prerelease: auto # tag "v0.3.0-rc1" becomes pre-release

builds:
  - id: bin
    main: ./cmd/server
    # Static, with no libc dependency. Go turns cgo on for a native build when
    # a C compiler is present, so on the amd64 runner the linux binary linked
    # glibc and would not start on Alpine or NixOS; arm64 was static only
    # because it is cross-compiled.
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/geiserx/lynxprompt-mcp/version.Version={{ .Version }}
      - -X github.com/geiserx/lynxprompt-mcp/version.Commit={{ .ShortCommit }}
      - -X github.com/geiserx/lynxprompt-mcp/version.Date={{ .Date }}

# Signs the darwin binaries with a Developer ID certificate and notarizes them
# with Apple, from Linux, before they are archived. Skipped when the secrets
# are absent (pull requests, snapshots); release.yml fails a tag build that
# lacks any of them, so a release is never shipped unsigned by accident.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [bin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: dist
    ids: [bin]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

# The Dockerfile builds the binary from source, so the context gets the source
# files. Published: <tag> and latest as linux/amd64 + linux/arm64 indexes, plus
# the single-platform <tag>-<arch> and latest-<arch> tags. SBOM and provenance
# are off, so each index holds the two images and nothing else.
dockers_v2:
  - id: multiarch
    images: [drumsergio/lynxprompt-mcp]
    tags:
      - "{{ .Tag }}"
      # Empty, so not pushed, for a pre-release: latest stays on the last stable tag.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    extra_files: &extra_files
      - go.mod
      - go.sum
      - cmd/
      - internal/
      - client/
      - config/
      - version/
      - .goreleaser.yaml
    build_args: &build_args
      VERSION: "{{ .Version }}"
      COMMIT: "{{ .ShortCommit }}"
      DATE: "{{ .Date }}"
    sbom: "false"
    flags: &flags
      - "--provenance=false"
  - id: amd64
    images: [drumsergio/lynxprompt-mcp]
    tags:
      - "{{ .Tag }}-amd64"
      - "{{ if not .Prerelease }}latest-amd64{{ end }}"
    platforms: [linux/amd64]
    extra_files: *extra_files
    build_args: *build_args
    sbom: "false"
    flags: *flags
  - id: arm64
    images: [drumsergio/lynxprompt-mcp]
    tags:
      - "{{ .Tag }}-arm64"
      - "{{ if not .Prerelease }}latest-arm64{{ end }}"
    platforms: [linux/arm64]
    extra_files: *extra_files
    build_args: *build_args
    sbom: "false"
    flags: *flags

snapshot:
  version_template: "snapshot-{{ .ShortCommit }}"

changelog:
  # goreleaser matches these against the bare commit subject; the catch-all
  # keeps every other commit in the notes.
  groups:
    - title: "Features"
      regexp: '^feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: "Fixes"
      regexp: '^fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: "Other changes"
      order: 999
